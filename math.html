<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math — potewww</title>
  <meta name="description" content="Math notes, lectures, and tutoring sessions by Filippo Rossi">

  <!-- Style & Fonts -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-wrapper">
    <!-- Reusable Shared Header & Navigation Drawer -->
    <header id="site-header"></header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <a href="index.html" class="back-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Home
        </a>
        <h1 class="page-title">Math</h1>
        <p class="page-subtitle">Lecture notes, study materials, and tutoring session archives.</p>
      </div>

      <div class="cards-grid detail-grid">
        <!-- Appunti Card -->
        <article id="appunti" class="card-article">
          <div class="card-border-overlay">
            <div class="border-line top"></div>
            <div class="border-line bottom"></div>
            <div class="border-line left"></div>
            <div class="border-line right"></div>
          </div>

          <div class="illustration-wrapper">
            <svg viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" class="illustration-svg">
              <line x1="40" y1="140" x2="40" y2="35" stroke="currentColor" stroke-width="1.2" />
              <path d="M37 41 L40 35 L43 41" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
              <line x1="35" y1="60" x2="165" y2="60" stroke="currentColor" stroke-width="1.2" />
              <circle cx="65" cy="60" r="6.5" fill="rgba(185, 186, 245, 0.4)" stroke="#B9BAF5" stroke-width="1.4" />
              <circle cx="105" cy="60" r="6.5" fill="rgba(185, 186, 245, 0.4)" stroke="#B9BAF5" stroke-width="1.4" />
              <circle cx="130" cy="95" r="6.5" fill="rgba(185, 186, 245, 0.4)" stroke="#B9BAF5" stroke-width="1.4" />
            </svg>
          </div>

          <div class="card-footer">
            <div class="indicator-bar"></div>
            <span class="card-label">Appunti</span>
            <span class="card-detail-text">Notes & Lectures</span>
          </div>
        </article>

        <!-- Tutorati Card -->
        <article id="tutorati" class="card-article">
          <div class="card-border-overlay">
            <div class="border-line top"></div>
            <div class="border-line bottom"></div>
            <div class="border-line left"></div>
            <div class="border-line right"></div>
          </div>

          <div class="illustration-wrapper">
            <svg viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" class="illustration-svg">
              <line x1="35" y1="95" x2="165" y2="95" stroke="currentColor" stroke-width="1.2" />
              <circle cx="65" cy="95" r="6.5" class="svg-muted-node" stroke-width="1.2" />
              <circle cx="105" cy="95" r="6.5" fill="rgba(185, 186, 245, 0.2)" stroke="#B9BAF5" stroke-width="1.2" opacity="0.8" />
              <circle cx="130" cy="95" r="6.5" fill="rgba(185, 186, 245, 0.4)" stroke="#B9BAF5" stroke-width="1.4" />
            </svg>
          </div>

          <div class="card-footer">
            <div class="indicator-bar"></div>
            <span class="card-label">Tutorati</span>
            <span class="card-detail-text">Tutoring Sessions</span>
          </div>
        </article>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data/menu-data.js"></script>
  <script src="js/utils/icons.js"></script>
  <script src="js/utils/theme.js"></script>
  <script src="js/components/nav-menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
