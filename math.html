<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math — potewww</title>
  <meta name="description" content="Math notes, lectures, and tutoring sessions by Filippo Rossi">

  <!-- Style & Fonts -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.classList.add(theme);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=2115">
</head>
<body>
  <div class="site-wrapper">
    <!-- Reusable Shared Header & Navigation Drawer -->
    <header id="site-header"></header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <a href="index.html" class="back-btn">
          <span data-svg="assets/icons/arrow-left.svg"></span>
          Back to Home
        </a>
        <h1 class="page-title">Math</h1>
        <p class="page-subtitle">Lecture notes, study materials, and tutoring session archives.</p>
      </div>

      <div class="cards-grid detail-grid">
        <!-- Appunti Card -->
        <a href="appunti.html" id="appunti" class="card-article" aria-label="Appunti Section">
          <div class="card-border-overlay">
            <div class="border-line top"></div>
            <div class="border-line bottom"></div>
            <div class="border-line left"></div>
            <div class="border-line right"></div>
          </div>

          <div class="illustration-wrapper" data-svg="assets/illustrations/appunti.svg" data-svg-class="illustration-svg"></div>

          <div class="card-footer">
            <div class="indicator-bar"></div>
            <span class="card-label">Appunti</span>
            <span class="card-detail-text">Notes & Lectures</span>
          </div>
        </a>

        <!-- Tutorati Card -->
        <article id="tutorati" class="card-article">
          <div class="card-border-overlay">
            <div class="border-line top"></div>
            <div class="border-line bottom"></div>
            <div class="border-line left"></div>
            <div class="border-line right"></div>
          </div>

          <div class="illustration-wrapper" data-svg="assets/illustrations/tutorati.svg" data-svg-class="illustration-svg"></div>

          <div class="card-footer">
            <div class="indicator-bar"></div>
            <span class="card-label">Tutorati</span>
            <span class="card-detail-text">Tutoring Sessions</span>
          </div>
        </article>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data/menu-data.js"></script>
  <script src="js/utils/icons.js"></script>
  <script src="js/utils/theme.js"></script>
  <script src="js/components/nav-menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
