<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>potewww — Filippo Rossi</title>
  <meta name="description" content="Personal site of Filippo Rossi">

  <!-- Style & Fonts -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-wrapper">
    <!-- Reusable Shared Header & Navigation Drawer -->
    <header id="site-header"></header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="cards-grid">
        <!-- Math Card -->
        <a href="math.html" class="card-article" aria-label="Math Section">
          <div class="card-border-overlay">
            <div class="border-line top"></div>
            <div class="border-line bottom"></div>
            <div class="border-line left"></div>
            <div class="border-line right"></div>
          </div>

          <div class="illustration-wrapper" data-svg="assets/illustrations/math.svg" data-svg-class="illustration-svg"></div>

          <div class="card-footer">
            <div class="indicator-bar"></div>
            <span class="card-label">Math</span>
          </div>
        </a>

        <!-- Projects Card -->
        <a href="projects.html" class="card-article" aria-label="Projects Section">
          <div class="card-border-overlay">
            <div class="border-line top"></div>
            <div class="border-line bottom"></div>
            <div class="border-line left"></div>
            <div class="border-line right"></div>
          </div>

          <div class="illustration-wrapper" data-svg="assets/illustrations/projects.svg" data-svg-class="illustration-svg"></div>

          <div class="card-footer">
            <div class="indicator-bar"></div>
            <span class="card-label">Projects</span>
          </div>
        </a>

        <!-- Work in Progress Card -->
        <a href="wip.html" class="card-article" aria-label="Work in Progress Section">
          <div class="card-border-overlay">
            <div class="border-line top"></div>
            <div class="border-line bottom"></div>
            <div class="border-line left"></div>
            <div class="border-line right"></div>
          </div>

          <div class="illustration-wrapper" data-svg="assets/illustrations/wip.svg" data-svg-class="illustration-svg"></div>

          <div class="card-footer">
            <div class="indicator-bar"></div>
            <span class="card-label">Work in Progress</span>
          </div>
        </a>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data/menu-data.js"></script>
  <script src="js/utils/icons.js"></script>
  <script src="js/utils/theme.js"></script>
  <script src="js/components/nav-menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
