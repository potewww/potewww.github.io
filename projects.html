<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — potewww</title>
  <meta name="description" content="Projects developed by Filippo Rossi">

  <!-- Style & Fonts -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-wrapper">
    <!-- Reusable Shared Header & Navigation Drawer -->
    <header id="site-header"></header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <a href="index.html" class="back-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Home
        </a>
        <h1 class="page-title">Projects</h1>
        <p class="page-subtitle">Web apps, trackers, and content creation.</p>
      </div>

      <div class="cards-grid">
        <!-- PoteSplit Card -->
        <article id="potesplit" class="card-article">
          <div class="card-border-overlay">
            <div class="border-line top"></div>
            <div class="border-line bottom"></div>
            <div class="border-line left"></div>
            <div class="border-line right"></div>
          </div>

          <div class="illustration-wrapper">
            <svg viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" class="illustration-svg">
              <g>
                <path d="M88,83 L100,76 L112,83 L100,90 Z" fill="rgba(185, 186, 245, 0.45)" stroke="#B9BAF5" stroke-width="1.2" />
                <path d="M88,83 L100,90 L100,104 L88,97 Z" fill="rgba(185, 186, 245, 0.3)" stroke="#B9BAF5" stroke-width="1.2" />
                <path d="M112,83 L100,90 L100,104 L112,97 Z" fill="rgba(185, 186, 245, 0.4)" stroke="#B9BAF5" stroke-width="1.2" />
              </g>
            </svg>
          </div>

          <div class="card-footer">
            <div class="indicator-bar"></div>
            <span class="card-label">PoteSplit</span>
            <span class="card-detail-text">Web Application</span>
          </div>
        </article>

        <!-- TV-Tracker Card -->
        <article id="tv-tracker" class="card-article">
          <div class="card-border-overlay">
            <div class="border-line top"></div>
            <div class="border-line bottom"></div>
            <div class="border-line left"></div>
            <div class="border-line right"></div>
          </div>

          <div class="illustration-wrapper">
            <svg viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" class="illustration-svg">
              <g opacity="0.8">
                <path d="M76,83 L88,76 L100,83 L88,90 Z" fill="rgba(229, 231, 235, 0.15)" stroke="currentColor" stroke-width="0.8" />
                <path d="M76,83 L88,90 L88,104 L76,97 Z" fill="rgba(209, 213, 219, 0.1)" stroke="currentColor" stroke-width="0.8" />
                <path d="M100,83 L88,90 L88,104 L100,97 Z" fill="rgba(243, 244, 246, 0.2)" stroke="currentColor" stroke-width="0.8" />
              </g>
            </svg>
          </div>

          <div class="card-footer">
            <div class="indicator-bar"></div>
            <span class="card-label">TV-Tracker</span>
            <span class="card-detail-text">Entertainment Tracker</span>
          </div>
        </article>

        <!-- YouTube Card -->
        <article id="youtube" class="card-article">
          <div class="card-border-overlay">
            <div class="border-line top"></div>
            <div class="border-line bottom"></div>
            <div class="border-line left"></div>
            <div class="border-line right"></div>
          </div>

          <div class="illustration-wrapper">
            <svg viewBox="0 0 200 180" fill="none" xmlns="http://www.w3.org/2000/svg" class="illustration-svg">
              <g opacity="0.8">
                <path d="M100,83 L112,76 L124,83 L112,90 Z" fill="rgba(229, 231, 235, 0.15)" stroke="currentColor" stroke-width="0.8" />
                <path d="M100,83 L112,90 L112,104 L100,97 Z" fill="rgba(209, 213, 219, 0.1)" stroke="currentColor" stroke-width="0.8" />
                <path d="M124,83 L112,90 L112,104 L124,97 Z" fill="rgba(243, 244, 246, 0.2)" stroke="currentColor" stroke-width="0.8" />
              </g>
            </svg>
          </div>

          <div class="card-footer">
            <div class="indicator-bar"></div>
            <span class="card-label">YouTube</span>
            <span class="card-detail-text">Video Channel</span>
          </div>
        </article>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data/menu-data.js"></script>
  <script src="js/utils/icons.js"></script>
  <script src="js/utils/theme.js"></script>
  <script src="js/components/nav-menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
